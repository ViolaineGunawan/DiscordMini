<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Room — Discord Mini</title>
  <meta name="theme-color" content="#eef3ff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/room.css">
</head>
<body>
  <!-- Gradient mesh atmosphere (sama dengan landing page) -->
  <div class="mesh" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="blob b3"></span>
    <span class="blob b4"></span>
    <span class="blob b5"></span>
    <span class="grain"></span>
  </div>
  <div class="deco" aria-hidden="true">
    <span class="orb orb-a"></span>
    <span class="orb orb-b"></span>
  </div>

  <div class="app">

    <!-- Navigation bar (gelap) -->
    <header class="nav">
      <a class="brand" href="index.html" aria-label="Discord Mini, kembali ke daftar room">
        <span class="logo">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
            <defs>
              <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#8fc8ff"/>
                <stop offset=".5" stop-color="#c3a9ff"/>
                <stop offset="1" stop-color="#ffb3d4"/>
              </linearGradient>
            </defs>
            <path fill="url(#lg)" d="M5 3.5h14A3.5 3.5 0 0 1 22.500 7v8a3.5 3.5 0 0 1-3.500 3.500h-5.800l-3.900 3c-.6.5-1.500.1-1.500-.7V18.500H5A3.500 3.500 0 0 1 1.500 15V7A3.500 3.500 0 0 1 5 3.500z"/>
            <circle cx="8" cy="11" r="1.300" fill="#1b2342" opacity=".75"/>
            <circle cx="12" cy="11" r="1.300" fill="#1b2342" opacity=".75"/>
            <circle cx="16" cy="11" r="1.300" fill="#1b2342" opacity=".75"/>
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Discord Mini</span>
          <span class="online"><i class="pulse" aria-hidden="true"></i><b id="totalOnline">0</b>&nbsp;online now</span>
        </span>
      </a>
      <!-- Ganti href sesuai halaman login admin -->
      <a class="btn-signin" href="admin/login.html">
        Sign In
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>
    </header>

    <!-- Room header -->
    <section class="room-bar" aria-label="Info room">
      <div class="thumb" id="rThumb" aria-hidden="true"></div>
      <div class="r-text">
        <h1 id="rName">Memuat…</h1>
        <p class="r-meta"><i class="pulse" aria-hidden="true"></i><b id="rMembers">0</b>&nbsp;anggota di dalam room</p>
      </div>
      <div class="r-side">
        <span class="me-chip" title="Username kamu"><span class="me-dot" aria-hidden="true"></span><span id="meName"></span></span>
        <a class="btn-leave" href="index.html">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M16 8l4 4-4 4M20 12H9"/></svg>
          <span>Keluar</span>
        </a>
        <button type="button" class="btn-call" id="callBtn" aria-haspopup="dialog" aria-label="Mulai panggilan suara" title="Panggilan suara">
          <i class="pulse" id="callDot" aria-hidden="true" hidden></i>
          <span class="call-time" id="callTime" hidden>00:00</span>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.920v3a2 2 0 0 1-2.180 2 19.790 19.790 0 0 1-8.630-3.070 19.500 19.500 0 0 1-6-6 19.790 19.790 0 0 1-3.070-8.670A2 2 0 0 1 4.110 2h3a2 2 0 0 1 2 1.720 12.840 12.840 0 0 0 .7 2.810 2 2 0 0 1-.45 2.110L8.090 9.910a16 16 0 0 0 6 6l1.270-1.270a2 2 0 0 1 2.110-.45 12.840 12.840 0 0 0 2.810.7A2 2 0 0 1 22 16.920z"/></svg>
        </button>
      </div>
    </section>

    <!-- Percakapan -->
    <main class="chat" id="chat">
      <div class="stream" id="stream" role="log" aria-label="Percakapan room"></div>
    </main>

    <!-- Message input -->
    <form class="composer" id="composer" autocomplete="off">
      <div class="composer-in">
        <div class="pending" id="pending" hidden>
          <span class="p-thumb" id="pThumb" aria-hidden="true"></span>
          <span class="p-text"><b id="pName"></b><small id="pSize"></small></span>
          <button type="button" class="p-remove" id="pRemove" aria-label="Hapus lampiran">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.400" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <div class="row">
          <input id="file" type="file" hidden>
          <button type="button" class="icon-btn" id="attach" aria-label="Lampirkan file, foto, atau audio" title="Lampirkan file, foto, atau audio">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.440 11.050l-9.190 9.190a6 6 0 0 1-8.490-8.490l9.190-9.190a4 4 0 0 1 5.660 5.660l-9.200 9.190a2 2 0 0 1-2.830-2.830l8.480-8.480"/></svg>
          </button>

          <label class="sr" for="msg">Tulis pesan</label>
          <textarea id="msg" rows="1" maxlength="2000" placeholder="Tulis pesan"></textarea>

          <button type="submit" class="send" id="send" aria-label="Kirim pesan" disabled>
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.800" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>
    </form>
  </div>

  <!-- Popup Start / Join call -->
  <div id="callModal" class="modal" aria-hidden="true" inert>
    <div class="modal-bg" data-close></div>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="cTitle" aria-describedby="cDesc">
      <span class="orb dialog-orb dialog-orb-a" aria-hidden="true"></span>
      <span class="orb dialog-orb dialog-orb-b" aria-hidden="true"></span>
      <span class="call-orb" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#1b2342" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.920v3a2 2 0 0 1-2.180 2 19.790 19.790 0 0 1-8.630-3.070 19.500 19.500 0 0 1-6-6 19.790 19.790 0 0 1-3.070-8.670A2 2 0 0 1 4.110 2h3a2 2 0 0 1 2 1.720 12.840 12.840 0 0 0 .7 2.810 2 2 0 0 1-.45 2.110L8.090 9.910a16 16 0 0 0 6 6l1.270-1.270a2 2 0 0 1 2.110-.45 12.840 12.840 0 0 0 2.810.7A2 2 0 0 1 22 16.920z"/></svg>
      </span>
      <h2 id="cTitle">Start call?</h2>
      <p class="dlg-lead" id="cDesc"></p>
      <p class="live-info" id="cLive" hidden><i class="pulse" aria-hidden="true"></i><b id="cTime">00:00</b><span id="cCount"></span></p>
      <div class="dlg-actions">
        <button type="button" class="btn-ghost" data-close id="cNo">Tidak</button>
        <button type="button" class="btn-primary" id="cYes">Ya</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="../js/rooms.js"></script>
  <script src="../js/callstore.js"></script>
  <script src="../js/room.js"></script>
</body>
</html>
